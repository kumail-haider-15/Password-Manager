<!-- 
    Password Manager - Forget Password Page
    Allows users who have forgotten their password to request a reset link via email.
    User enters their email address, and a password reset link is sent to them.
    The reset link expires after 30 minutes for security.
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Link to main stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/style.css') }}">
    <title>Forget Password</title>
</head>

<body>
<!-- Page heading -->
<h1>Forget Password</h1>

<!-- Display flash messages (errors, warnings, etc.) from backend -->
{% with messages = get_flashed_messages() %}
{% if messages %}
{% for message in messages %}
<p class="flash {{ category }}">{{ message }}</p>
{% endfor %}
{% endif %}
{% endwith %}

<!-- Password reset request form -->
<!-- Submits to the forget_password route with POST method -->
<form action="{{ url_for('forget_password') }}" method="post">
    <!-- Email input - must match an existing account -->
    <!-- User will receive a password reset link at this email address -->
    <input type="text" placeholder="Enter email" name="email">

    <!-- Submit button - initiates password reset email -->
    <button type="submit">Submit</button>
</form>

</body>

</html>
