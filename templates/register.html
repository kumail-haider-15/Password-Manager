<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/style.css') }}">
    <title>Register</title>
</head>

<body>
<h1>Register</h1>

{% with messages = get_flashed_messages() %}
{% if messages %}
{% for message in messages %}
<p class="flash {{ category }}">{{ message }}</p>
{% endfor %}
{% endif %}
{% endwith %}

<form action="{{ url_for('register') }}" method="post">
    <input type="text" placeholder="Enter your name" name="username" value="{{ username or '' }}"><br>
    <input type="email" placeholder="Enter email" name="email" value="{{ email or '' }}"><br>
    <input type="password" placeholder="Enter password" name="password"><br>
    <input type="password" placeholder="Confirm password" name="confirm_password"><br>
    <button type="submit">Submit</button>
    <br>
    <a href="{{ url_for('login') }}">Already have an account? Login here</a>
</form>

</body>

</html>
