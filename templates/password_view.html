<!-- 
    Password Manager - Password View Page
    Displays all saved passwords for a specific website/service.
    Features: View password (initially masked), toggle visibility, copy to clipboard, delete entry.
    Uses AJAX to fetch and decrypt passwords securely on demand.
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Link to main stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/style.css') }}">
    <!-- Include JavaScript for password viewing and copy functionality -->
    <script src="{{ url_for('static', filename='JS/script.js') }}" defer></script>

    <title>{{ website_name }}</title>
</head>

<body>

<!-- Back button to return to dashboard -->
<a href="{{ url_for('dashboard') }}" class="btn back-btn">
    ← Dashboard
</a>

<!-- Website/service name heading -->
<h1>{{ website_name }}</h1>

<!-- Loop through each saved password entry for this website -->
{% for password in passwords %}
<div class="view-card">

    <!-- Username/Email Row -->
    <div class="view-row">
        <!-- Label for the field -->
        <label>Username / Email</label>

        <!-- Display value with copy button -->
        <div class="view-value">
            <!-- Display the username/email (this is always visible) -->
            <span id="username">
                {{ password.email_or_username }}
            </span>

            <!-- Copy to clipboard button for username -->
            <button
                    class="icon-btn copy-btn"
                    data-copy="{{ password.email_or_username }}"
                    title="Copy">
                📋
            </button>

        </div>
    </div>

    <!-- Password Row -->
    <div class="view-row">
        <!-- Label for the field -->
        <label>Password</label>

        <!-- Display value with toggle and copy buttons -->
        <div class="view-value">

            <!-- 
                Password display: Initially shows dots (••••••••) for security
                On toggle click, fetches actual password via AJAX and displays it
                data-password-id: Links this display to a specific password record
            -->
            <span
                    class="password-text"
                    data-password-id="{{ password.id }}">
                ••••••••
            </span>

            <!-- Toggle button to show/hide password (handled by script.js) -->
            <button
                    type="button"
                    class="icon-btn toggle-view-password"
                    title="Show Password">
                👁
            </button>

            <!-- Copy password to clipboard button -->
            <!-- This button also requires the password to be fetched/visible -->
            <button
                    type="button"
                    class="icon-btn copy-password-btn"
                    data-password-id="{{ password.id }}"
                    title="Copy">
                📋
            </button>

        </div>

    </div>

</div>

<!-- Delete button with confirmation to prevent accidental deletion -->
<a class="btn-danger" href="{{ url_for('delete_password', password_id=password.id) }}"
   onclick="return confirm('Delete this password?')">Delete</a>

{% endfor %}

</body>

</html>
