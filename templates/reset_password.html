<!-- 
    Password Manager - Reset Password Page
    Allows users to set a new password after clicking the reset link from their email.
    Token is embedded in the URL and validated on the backend (expires in 30 minutes).
    New password must meet security requirements (checked by backend).
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Link to main stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/style.css') }}">
    <title>Reset Password</title>
</head>

<!-- Include JavaScript for password toggle functionality -->
<script src="{{ url_for('static', filename='JS/script.js') }}"></script>

<body>
<!-- Page heading -->
<h1>Reset Password</h1>

<!-- Display flash messages (errors, warnings, etc.) from backend -->
{% with messages = get_flashed_messages() %}
{% if messages %}
{% for message in messages %}
<p class="flash {{ category }}">{{ message }}</p>
{% endfor %}
{% endif %}
{% endwith %}

<!-- Password reset form: submits to the reset_password route with POST method -->
<!-- The reset token is automatically included in the URL route -->
<form method="post">
    <!-- New password input with visibility toggle -->
    <div class="password-wrapper">
        <input type="password" class="password" name="password" placeholder="Enter password">
        <!-- Eye icon button to toggle password visibility (handled by script.js) -->
        <button type="button" class="toggle-input-password">👁</button>
    </div>

    <!-- Password confirmation input with visibility toggle -->
    <!-- Note: Both passwords must match to proceed -->
    <div class="password-wrapper">
        <input type="password" class="password" name="confirm_password" placeholder="Confirm password">
        <!-- Eye icon button to toggle password visibility (handled by script.js) -->
        <button type="button" class="toggle-input-password">👁</button>
    </div>

    <!-- Submit button - validates password strength and confirmation on backend -->
    <button type="submit">Submit</button>
</form>

</body>

</html>
